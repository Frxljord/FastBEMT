[project]
name = "FastBEMT"
version = "0.1.0"
description = "A fast approximate BEMT solver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerosandbox>=4.2.9",
    "ipykernel>=7.3.0",
    "matplotlib==3.10.9",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "scienceplots>=2.2.2",
    "scipy>=1.16.3",
    "torch>=2.8.0",
]

[project.optional-dependencies]
examples = [
    "ipykernel>=6.29.5",
    "scienceplots>=2.2.2",
]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["FastBEMT*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 88
target-version = "py312"


[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }